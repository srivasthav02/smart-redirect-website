<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Redirect - AI and productivity tools in one place</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Smart Redirect</h1>
  <p>Open any AI or productivity tool from one page.</p>
  <input id="search" type="search" placeholder="Search tools" aria-label="Search tools">
  <nav id="filters" aria-label="Filter by category"></nav>
</header>
<main>
  <ul id="grid"></ul>
  <p id="empty" hidden>No tools match your search. Clear the filter and try again.</p>
</main>
<script src="script.js"></script>
</body>
</html>
